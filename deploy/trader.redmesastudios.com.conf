# trader.redmesastudios.com: Far Markets (static pages + api/save.php), repo dbarkman/FarMarkets.
# Serves public/ only; the checkout's .git and data/ (saved games) stay outside the web root.
# Port 80 redirects to HTTPS, except Let's Encrypt challenges, which come from trader-acme.
# This file is the source for /etc/httpd/conf.d/trader.redmesastudios.com.conf on web2.
<Directory /var/www/html/trader.redmesastudios.com/public>
    Require all granted
    AllowOverride None
    Options -Indexes
</Directory>
<Directory /var/www/html/trader-acme>
    Require all granted
</Directory>

<VirtualHost *:443>
    ServerName trader.redmesastudios.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/trader.redmesastudios.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/trader.redmesastudios.com/privkey.pem

    DocumentRoot /var/www/html/trader.redmesastudios.com/public
    Header always set X-Robots-Tag "noindex, nofollow"
    # Game files change with each deploy; make browsers check before reusing them.
    <FilesMatch "\.(html|js|css|webmanifest)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    ErrorLog  /var/log/httpd/trader_error.log
    CustomLog /var/log/httpd/trader_access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName trader.redmesastudios.com
    DocumentRoot /var/www/html/trader-acme
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^ https://trader.redmesastudios.com%{REQUEST_URI} [R=permanent,L]
    ErrorLog  /var/log/httpd/trader_error.log
    CustomLog /var/log/httpd/trader_access.log combined
</VirtualHost>
