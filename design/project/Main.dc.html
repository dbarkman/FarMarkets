<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Age of Sail market</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B2A4A}a:hover{color:#B5382A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2EAD8; color: #1B2A4A; font-family: 'Spectral', Georgia, serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<svg aria-hidden="true" width="390" height="150" viewBox="0 0 390 150" style="position: absolute; top: 0; left: 0">
<g fill="none" stroke="#1B2A4A" stroke-width="1" opacity="0.16">
<path d="M-10 118 q20 -16 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
<path d="M-30 130 q20 -16 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
<path d="M-10 142 q20 -16 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
<circle cx="318" cy="62" r="44"/><circle cx="318" cy="62" r="36"/>
<path d="M318 12 L324 56 L368 62 L324 68 L318 112 L312 68 L268 62 L312 56 Z"/>
</g>
</svg>
<div style="padding: 28px 24px 0 24px; display: flex; justify-content: space-between; align-items: flex-start; position: relative">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #5A584C">Day 42 · Monsoon season</div>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 50px; line-height: 1">Macau</h1>
<div style="font-size: 15px; font-style: italic; color: #5A584C">Mouth of the Pearl River</div>
</div>
<div style="width: 54px; height: 54px; background: #B5382A; border-radius: 6px; display: flex; align-items: center; justify-content: center; transform: rotate(-4deg)">
<svg role="img" aria-label="Your ship" width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#F2EAD8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 23 h26 l-4 6 h-18 z"/><path d="M17 23 V4"/><path d="M17 6 q9 5 9 14 h-9"/><path d="M15 9 q-7 4 -7 11 h7"/></svg>
</div>
</div>
<div style="margin: 22px 24px 0 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 2px solid #1B2A4A; border-bottom: 1px solid #1B2A4A; position: relative">
<div style="padding: 10px 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #5A584C">Silver</div>
<div style="font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 26px">12,480</div>
</div>
<div style="padding: 10px 0 10px 14px; border-left: 1px solid #1B2A4A; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #5A584C">Debt</div>
<div style="font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 26px; color: #B5382A">3,200</div>
</div>
<div style="padding: 10px 0 10px 14px; border-left: 1px solid #1B2A4A; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #5A584C">Hold</div>
<div style="font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 26px">46<span style="font-size: 16px; font-weight: 500; color: #5A584C"> of 120</span></div>
</div>
</div>
<div style="padding: 18px 24px 8px 24px; display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 24px">The market</h2>
<div style="font-size: 13px; font-style: italic; color: #5A584C">price per chest</div>
</div>
<div style="padding: 0 24px; display: flex; flex-direction: column; flex-grow: 1">
<sc-for list="{{goods}}" as="g" hint-placeholder-count="6">
<button type="button" style="all: unset; cursor: pointer; display: grid; grid-template-columns: 1fr 92px 76px; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px dashed #8C8672; min-height: 44px">
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 22px; line-height: 1.1">{{g.name}}</span>
<span style="font-size: 13px; color: {{g.noteColor}}">{{g.note}}</span>
</span>
<span style="position: relative; height: 18px; display: block">
<span style="position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: #1B2A4A; opacity: 0.35"></span>
<span style="position: absolute; left: {{g.pos}}; top: 2px; width: 10px; height: 14px; background: {{g.markColor}}; transform: translateX(-5px) rotate(45deg); border-radius: 2px"></span>
</span>
<span style="text-align: right; font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 26px">{{g.price}}</span>
</button>
</sc-for>
</div>
<nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid #1B2A4A; background: #EBE1CB; padding: 8px 12px 18px 12px">
<a href="#market" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; min-height: 44px; font-size: 13px; font-weight: 600; color: #B5382A; border-top: 3px solid #B5382A; margin-top: -10px; padding-top: 13px">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 h16 l-1.5 11 h-13 z"/><path d="M8 9 a4 4 0 0 1 8 0"/></svg>Market</a>
<a href="#chart" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; min-height: 44px; font-size: 13px">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 l-2 5 l-5 2 l2 -5 z"/></svg>Chart</a>
<a href="#harbor" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; min-height: 44px; font-size: 13px">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7 v14"/><path d="M5 13 a7 7 0 0 0 14 0"/><path d="M9 10 h6"/></svg>Harbor</a>
<a href="#ledger" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; min-height: 44px; font-size: 13px">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 h12 v18 h-12 z"/><path d="M9 8 h6 M9 12 h6 M9 16 h4"/></svg>Ledger</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const ink = '#1B2A4A', red = '#B5382A', green = '#2C6B5E', mute = '#5A584C';
return { goods: [
{ name: 'Silk', note: 'Cheap here · you hold 20', noteColor: green, pos: '18%', markColor: green, price: '412' },
{ name: 'Porcelain', note: 'Cheap here', noteColor: green, pos: '26%', markColor: green, price: '188' },
{ name: 'Tea', note: 'A fair price', noteColor: mute, pos: '48%', markColor: ink, price: '64' },
{ name: 'Pepper', note: 'Dear here · you hold 26', noteColor: red, pos: '84%', markColor: red, price: '231' },
{ name: 'Sandalwood', note: 'A fair price', noteColor: mute, pos: '55%', markColor: ink, price: '142' },
{ name: 'Copper', note: 'Dear here', noteColor: red, pos: '72%', markColor: red, price: '97' }
] };
}
}
</script>
</body>
</html>
