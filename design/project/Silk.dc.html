<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Silk Road market</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F0C36A}a:hover{color:#FFE2A6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #5E2116; color: #F6E6C4; font-family: 'Alegreya Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<svg aria-hidden="true" width="390" height="34" viewBox="0 0 390 34" style="display: block; background: #16464F">
<g fill="none" stroke="#F0C36A" stroke-width="1.4">
<path d="M0 17 L17 0 L34 17 L17 34 Z M34 17 L51 0 L68 17 L51 34 Z M68 17 L85 0 L102 17 L85 34 Z M102 17 L119 0 L136 17 L119 34 Z M136 17 L153 0 L170 17 L153 34 Z M170 17 L187 0 L204 17 L187 34 Z M204 17 L221 0 L238 17 L221 34 Z M238 17 L255 0 L272 17 L255 34 Z M272 17 L289 0 L306 17 L289 34 Z M306 17 L323 0 L340 17 L323 34 Z M340 17 L357 0 L374 17 L357 34 Z M374 17 L391 0 L408 17 L391 34 Z"/>
</g>
<g fill="#F0C36A">
<rect x="12" y="12" width="10" height="10" transform="rotate(45 17 17)"/><rect x="46" y="12" width="10" height="10" transform="rotate(45 51 17)"/><rect x="80" y="12" width="10" height="10" transform="rotate(45 85 17)"/><rect x="114" y="12" width="10" height="10" transform="rotate(45 119 17)"/><rect x="148" y="12" width="10" height="10" transform="rotate(45 153 17)"/><rect x="182" y="12" width="10" height="10" transform="rotate(45 187 17)"/><rect x="216" y="12" width="10" height="10" transform="rotate(45 221 17)"/><rect x="250" y="12" width="10" height="10" transform="rotate(45 255 17)"/><rect x="284" y="12" width="10" height="10" transform="rotate(45 289 17)"/><rect x="318" y="12" width="10" height="10" transform="rotate(45 323 17)"/><rect x="352" y="12" width="10" height="10" transform="rotate(45 357 17)"/>
</g>
</svg>
<div style="padding: 20px 22px 0 22px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
<div style="font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #F0C36A">Day 42 · High summer</div>
<h1 style="margin: 0; font-family: 'Marcellus', serif; font-weight: 400; font-size: 44px; line-height: 1.1; color: #FFF3D6">Samarkand</h1>
<div style="font-size: 16px; color: #E8CFA4">Crossroads of the Sogdian merchants</div>
</div>
<div style="margin: 18px 22px 0 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="background: #16464F; border: 1.5px solid #F0C36A; border-radius: 60px 60px 8px 8px; padding: 16px 6px 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #F0C36A">Dirhams</div>
<div style="font-family: 'Marcellus', serif; font-size: 23px; color: #FFF3D6">12,480</div>
</div>
<div style="background: #16464F; border: 1.5px solid #F0C36A; border-radius: 60px 60px 8px 8px; padding: 16px 6px 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #F0C36A">Debt</div>
<div style="font-family: 'Marcellus', serif; font-size: 23px; color: #FFB59A">3,200</div>
</div>
<div style="background: #16464F; border: 1.5px solid #F0C36A; border-radius: 60px 60px 8px 8px; padding: 16px 6px 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #F0C36A">Packs</div>
<div style="font-family: 'Marcellus', serif; font-size: 23px; color: #FFF3D6">46<span style="font-size: 15px; color: #E8CFA4"> / 80</span></div>
</div>
</div>
<div style="padding: 18px 22px 8px 22px; display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Marcellus', serif; font-weight: 400; font-size: 22px; color: #FFF3D6">The bazaar</h2>
<div style="font-size: 14px; color: #E8CFA4">price per bale</div>
</div>
<div style="padding: 0 22px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
<sc-for list="{{goods}}" as="g" hint-placeholder-count="6">
<button type="button" style="all: unset; cursor: pointer; box-sizing: border-box; display: grid; grid-template-columns: 1fr 84px 70px; align-items: center; gap: 12px; padding: 9px 14px; background: #F6E6C4; color: #4A1A10; border-radius: 10px; border-bottom: 3px solid #C99A45; min-height: 56px">
<span style="display: flex; flex-direction: column; gap: 0">
<span style="font-family: 'Marcellus', serif; font-size: 20px; line-height: 1.15">{{g.name}}</span>
<span style="font-size: 14px; font-weight: 500; color: {{g.noteColor}}">{{g.note}}</span>
</span>
<span style="position: relative; height: 16px; display: block">
<span style="position: absolute; left: 0; right: 0; top: 5px; height: 6px; border-radius: 3px; background: #E3CB9A"></span>
<span style="position: absolute; left: {{g.pos}}; top: 0; width: 16px; height: 16px; border-radius: 8px; background: {{g.markColor}}; border: 2px solid #F6E6C4; box-sizing: border-box; transform: translateX(-8px)"></span>
</span>
<span style="text-align: right; font-family: 'Marcellus', serif; font-size: 24px">{{g.price}}</span>
</button>
</sc-for>
</div>
<nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #3F140C; border-top: 2px solid #F0C36A; padding: 8px 12px 18px 12px; margin-top: 12px">
<a href="#bazaar" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 44px; font-size: 14px; font-weight: 700; color: #3F140C; background: #F0C36A; border-radius: 22px 22px 6px 6px">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 h16 l-1.5 11 h-13 z"/><path d="M8 9 a4 4 0 0 1 8 0"/></svg>Bazaar</a>
<a href="#road" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 44px; font-size: 14px">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19 q5 -9 9 -5 t9 -9"/><circle cx="3.5" cy="19" r="1.5"/><circle cx="20.5" cy="5" r="1.5"/></svg>Road</a>
<a href="#inn" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 44px; font-size: 14px">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21 V11 a8 8 0 0 1 16 0 V21 z"/><path d="M10 21 v-5 a2 2 0 0 1 4 0 v5"/></svg>Caravanserai</a>
<a href="#ledger" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 44px; font-size: 14px">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 h12 v18 h-12 z"/><path d="M9 8 h6 M9 12 h6 M9 16 h4"/></svg>Ledger</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = '#4A1A10', red = '#A3301C', teal = '#16606B', mute = '#6B4A32';
return { goods: [
{ name: 'Silk', note: 'Dear here · you carry 20', noteColor: red, pos: '82%', markColor: red, price: '655' },
{ name: 'Jade', note: 'Dear here', noteColor: red, pos: '70%', markColor: red, price: '910' },
{ name: 'Paper', note: 'A fair price', noteColor: mute, pos: '50%', markColor: dark, price: '74' },
{ name: 'Glassware', note: 'Cheap here · you carry 26', noteColor: teal, pos: '20%', markColor: teal, price: '128' },
{ name: 'Horses', note: 'Cheap here', noteColor: teal, pos: '14%', markColor: teal, price: '340' },
{ name: 'Saffron', note: 'A fair price', noteColor: mute, pos: '44%', markColor: dark, price: '486' }
] };
}
}
</script>
</body>
</html>
